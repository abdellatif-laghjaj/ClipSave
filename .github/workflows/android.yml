name: ClipSave CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipSave-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Check for signing secrets
        id: keycheck
        run: echo "available=${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEY_ALIAS != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Sign release APK
        id: sign
        if: steps.keycheck.outputs.available == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Prepare unsigned release APKs
        if: steps.keycheck.outputs.available != 'true'
        run: |
          mkdir -p app/build/publish
          cp app/build/outputs/apk/release/*.apk app/build/publish/

      - name: Prepare signed release APKs
        if: steps.keycheck.outputs.available == 'true'
        run: |
          mkdir -p app/build/publish
          shopt -s nullglob
          signed_files=(app/build/outputs/apk/release/*-signed.apk)
          if (( ${#signed_files[@]} == 0 )); then
            echo "::error::Signing completed but produced no signed APK files."
            find app/build/outputs/apk/release -maxdepth 1 -type f -print
            exit 1
          fi
          cp "${signed_files[@]}" app/build/publish/
          ls -lh app/build/publish

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ClipSave-release
          path: app/build/publish/*.apk
          if-no-files-found: error
