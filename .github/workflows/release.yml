name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Check for signing secrets
        id: keycheck
        run: echo "available=${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEY_ALIAS != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Require release signing
        if: steps.keycheck.outputs.available != 'true'
        run: |
          echo "::error::Tagged releases require all Android signing secrets."
          exit 1

      - name: Sign release APK
        id: sign
        if: steps.keycheck.outputs.available == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Prepare signed release APKs
        env:
          SIGNED_RELEASE_FILES: ${{ steps.sign.outputs.signedReleaseFiles }}
        run: |
          mkdir -p app/build/publish
          IFS=':' read -ra files <<< "$SIGNED_RELEASE_FILES"
          for file in "${files[@]}"; do
            test -n "$file"
            cp "$file" app/build/publish/
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/publish/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
